<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Years With You ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        h1 {
            color: #f43f5e;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .time-box {
            background: #0f172a;
            padding: 12px 5px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .time-num {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fb7185;
        }
        .time-label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
        }
        .section-title {
            font-weight: 600;
            margin: 20px 0 10px;
            color: #cbd5e1;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .photo-placeholder {
            background: #334155;
            height: 90px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #94a3b8;
        }
        button {
            background: #f43f5e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        button:hover { background: #e11d48; }
        .hidden-msg {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #0f172a;
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.5;
            border-left: 4px solid #f43f5e;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>2 Years Together</h1>
    <p class="subtitle">Every second since we met has been an adventure.</p>

    <!-- Real-time Timer -->
    <div class="timer-grid">
        <div class="time-box"><div class="time-num" id="days">730</div><div class="time-label">Days</div></div>
        <div class="time-box"><div class="time-num" id="hours">0</div><div class="time-label">Hours</div></div>
        <div class="time-box"><div class="time-num" id="mins">0</div><div class="time-label">Mins</div></div>
        <div class="time-box"><div class="time-num" id="secs">0</div><div class="time-label">Secs</div></div>
    </div>

    <!-- Photo Slots -->
    <div class="section-title">Our Favorite Moments</div>
    <div class="gallery">
        <div class="photo-placeholder">📸</div>
        <div class="photo-placeholder">❤️</div>
        <div class="photo-placeholder">✨</div>
    </div>

    <!-- Secret Note -->
    <button onclick="toggleNote()">Click to read my note 💌</button>
    <div id="note" class="hidden-msg">
        Happy 2nd Anniversary! Thank you for 730 days of laughs, support, and endless memories. Here's to many more chapters together! 🥂
    </div>
</div>

<script>
    // Live Timer Script
    let seconds = 0, minutes = 0, hours = 0, days = 730;
    setInterval(() => {
        seconds++;
        if (seconds >= 60) { seconds = 0; minutes++; }
        if (minutes >= 60) { minutes = 0; hours++; }
        if (hours >= 24) { hours = 0; days++; }
        
        document.getElementById('secs').innerText = seconds;
        document.getElementById('mins').innerText = minutes;
        document.getElementById('hours').innerText = hours;
        document.getElementById('days').innerText = days;
    }, 1000);

    function toggleNote() {
        const note = document.getElementById('note');
        note.style.display = note.style.display === 'block' ? 'none' : 'block';
    }
</script>

</body>
</html>
