<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 2 Years!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .heart {
            font-size: 60px;
            color: #ff4b2b;
            cursor: pointer;
            display: inline-block;
            animation: pulse 1.2s infinite ease-in-out;
            margin-bottom: 15px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 1rem;
            color: #b3b3b3;
            margin-bottom: 25px;
        }
        .counter-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .days {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff416c;
        }
        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #aaa;
        }
        button {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4);
        }
        .secret-message {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
            color: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">❤️</div>
        <h1>2 Years Together</h1>
        <p class="subtitle">Since the day we first met</p>

        <div class="counter-box">
            <div class="days" id="daysCount">730</div>
            <div class="label">Days of Happiness</div>
        </div>

        <button onclick="revealNote()">Click for a surprise</button>

        <div class="secret-message" id="note">
            Two years down, and you’re still my favorite notification, my best friend, and my favorite person to code life with. Happy Anniversary! 💕
        </div>
    </div>

    <script>
        function revealNote() {
            const note = document.getElementById('note');
            if (note.style.display === 'block') {
                note.style.display = 'none';
            } else {
                note.style.display = 'block';
            }
        }
    </script>
</body>
</html>
